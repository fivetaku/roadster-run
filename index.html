<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOLT ROADSTER — 8비트 로드스터 점프 게임</title>
<meta name="description" content="?박스에서 번개를 먹고 충전, 2단 점프 배럴롤로 사막 고속도로를 달려 충전소까지. 브라우저에서 바로 하는 8비트 팬게임.">
<meta name="theme-color" content="#2a86ff">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="VOLT ROADSTER">
<meta property="og:description" content="번개 먹고 충전, 배럴롤로 점프! 브라우저 8비트 팬게임">
<meta property="og:url" content="https://roadster.tesduo.com/">
<meta property="og:image" content="https://roadster.tesduo.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  html,body{margin:0;height:100%;background:#0b0b10;overflow:hidden;touch-action:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  #touch{position:fixed;left:0;right:0;bottom:12px;display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
  #touch div{display:flex;gap:12px}
  #touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:#0006;color:#fff;font:bold 16px monospace;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<canvas id="c" width="400" height="224"></canvas>
<div id="touch">
  <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div><button data-k="run">RUN</button><button data-k="jump">JUMP</button></div>
</div>
<script src="music.js"></script>
<script src="game.js"></script>
</body>
</html>
